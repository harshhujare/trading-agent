name: Trading Agent Trading

# 10:00 AM ET, Mon–Fri. EDT (Mar–Nov) is UTC-4 → 14:00 UTC.
# When standard time begins (~early Nov), ET becomes UTC-5 → 15:00 UTC.
# Until we add a date-aware guard, flip this cron line at the DST transitions
# in lockstep with .github/workflows/{morning,eod,watchdog}.yml.
on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write   # finalize step needs to push journal/ commits
  id-token: write   # required by anthropics/claude-code-action for OIDC

jobs:
  trading:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
      APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
      APCA_BASE_URL: ${{ secrets.APCA_BASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install --quiet certifi requests

      - name: Configure git author
        run: |
          git config user.email "trading-agent@actions.local"
          git config user.name  "trading-agent"

      - name: Bootstrap routine state (env check + runlog marker)
        run: bash scripts/routine-setup.sh trading

      # Morning fires 15 min earlier and pushes journal/top5/<date>.json. The
      # 10:00 ET checkout above is a snapshot — if morning's commit hadn't
      # landed yet, the file is missing locally. Poll via `git pull --rebase`
      # for up to 20 min (mirrors run-routine.sh's local poll cap; see
      # 2026-05-07 incident where morning landed 90s after a 12-min timeout).
      - name: Wait for morning's top5.json
        run: |
          ET_DATE="$(TZ=America/New_York date +%F)"
          TOP5_FILE="journal/top5/${ET_DATE}.json"
          for i in $(seq 1 40); do  # 40 * 30s = 20 min
            git fetch --quiet origin main || true
            git reset --hard --quiet origin/main
            if [[ -f "$TOP5_FILE" ]]; then
              echo "top5 detected after $((i * 30))s: $TOP5_FILE"
              exit 0
            fi
            echo "waiting for $TOP5_FILE (iteration $i, elapsed $((i * 30))s)"
            sleep 30
          done
          echo "::warning::timed out waiting for $TOP5_FILE — proceeding so claude can log the miss"

      - name: Resolve today's ET date into the prompt
        run: |
          ET_DATE="$(TZ=America/New_York date +%F)"
          echo "ET_DATE=$ET_DATE" >> "$GITHUB_ENV"
          {
            echo "TRADING_PROMPT<<EOF_TRADING_PROMPT"
            sed "s|__ET_DATE__|$ET_DATE|g" scripts/prompts/trading.md
            echo "EOF_TRADING_PROMPT"
          } >> "$GITHUB_ENV"

      - name: Run claude — trading decisions
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          prompt: ${{ env.TRADING_PROMPT }}
          claude_args: |
            --model haiku
            --max-turns 25
            --allowedTools Bash,Read,Write,Edit,Glob,Grep

      - name: Reset git auth to workflow GITHUB_TOKEN
        if: always()
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git config --unset-all http.https://github.com/.extraheader || true

      - name: Finalize — commit + push journal/
        if: always()
        run: bash scripts/routine-finalize.sh trading
